<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>c++ dojo — learn what the machine does</title>
<style>:root{
  --bg:#0d1014; --bg2:#13171d; --bg3:#1a2028; --line:#262e39; --line2:#33404f;
  --tx:#d9dee6; --tx2:#9aa5b4; --tx3:#6b7684;
  --amb:#f0b23e; --amb2:#f0b23e22; --teal:#5ec8b8; --teal2:#5ec8b81f;
  --red:#ff6b6b; --red2:#ff6b6b1f; --vio:#a99cff; --vio2:#a99cff1f; --blu:#6cb2ff;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--sans)}
a{color:var(--teal);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,li code,td code,.inl code{background:var(--bg3);padding:.08em .35em;border-radius:4px;color:#e9d7a8}
::selection{background:var(--amb);color:#000}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 22px;background:#0d1014ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-weight:700;letter-spacing:-.02em;color:var(--tx);font-size:15px}
.brand b{color:var(--amb)}
.top nav{display:flex;gap:4px;margin-left:auto}
.top nav a{font-family:var(--mono);font-size:13px;color:var(--tx2);padding:6px 10px;border-radius:6px}
.top nav a:hover,.top nav a.on{background:var(--bg3);color:var(--tx);text-decoration:none}
.pill{display:inline-block;min-width:18px;padding:0 6px;margin-left:4px;border-radius:9px;background:var(--amb);color:#000;font-size:11px;font-weight:700;text-align:center}
.pill.z{background:var(--line2);color:var(--tx2)}

main{max-width:880px;margin:0 auto;padding:34px 22px 120px}
.wide{max-width:1100px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.2}
h1{font-size:40px;margin:.2em 0 .3em}
h2{font-size:26px;margin:1.6em 0 .5em}
h3{font-size:19px;margin:1.2em 0 .4em}
.kicker{font-family:var(--mono);font-size:12px;text-transform:lowercase;letter-spacing:.08em;color:var(--amb)}
.muted{color:var(--tx2)} .dim{color:var(--tx3)}
.small{font-size:13px}

/* home */
.hero{padding:20px 0 10px}
.hero p{font-family:var(--serif);font-size:20px;color:var(--tx2);max-width:640px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}
.stat{flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .n{font-family:var(--mono);font-size:26px;font-weight:700}
.stat .l{font-size:12px;color:var(--tx3);font-family:var(--mono)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 30px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--bg3);color:var(--tx);padding:9px 16px;border-radius:8px;font-size:14px;font-family:var(--mono)}
.btn:hover{border-color:var(--tx3);text-decoration:none}
.btn.pri{background:var(--amb);border-color:var(--amb);color:#111;font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.track{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px 18px 12px}
.track h3{margin:2px 0 4px;font-size:21px}
.track .desc{font-size:14px;color:var(--tx2);margin-bottom:10px}
.track ol{list-style:none;margin:0;padding:0}
.track li a{display:flex;align-items:center;gap:10px;padding:7px 8px;margin:0 -8px;border-radius:7px;color:var(--tx);font-size:15px}
.track li a:hover{background:var(--bg3);text-decoration:none}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--tx3);flex:none}
.dot.p{border-color:var(--amb);background:linear-gradient(90deg,var(--amb) 50%,transparent 50%)}
.dot.d{border-color:var(--teal);background:var(--teal)}
.track li .w{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--tx3)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--teal)}

/* lesson */
.lhead .src{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:5px;background:var(--bg3);color:var(--tx2);border:1px solid var(--line)}
.hook{margin:26px 0 8px;padding:18px 20px;border-left:3px solid var(--amb);background:linear-gradient(90deg,var(--amb2),transparent);font-family:var(--serif);font-size:21px;line-height:1.45}
.prog{position:fixed;left:0;top:0;height:2px;background:var(--amb);z-index:30;transition:width .3s}
.beat{animation:rise .35s ease both;margin:22px 0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.beat p{margin:.6em 0}
.beat ul{padding-left:1.2em} .beat li{margin:.3em 0}
.callout{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg2)}
.callout.edge{border-color:#ff6b6b55;background:var(--red2)}
.callout.edge::before{content:"edge case // you weren't thinking about this";display:block;font-family:var(--mono);font-size:11px;color:var(--red);margin-bottom:6px;letter-spacing:.04em}
.callout.rule{border-color:#5ec8b855;background:var(--teal2)}
.callout.rule::before{content:"rule of thumb";display:block;font-family:var(--mono);font-size:11px;color:var(--teal);margin-bottom:6px;letter-spacing:.04em}
.continue{display:flex;justify-content:center;margin:30px 0}
.continue .btn{padding:11px 26px}
.kbd{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-left:8px}

pre.code{position:relative;margin:12px 0;background:#0a0d11;border:1px solid var(--line);border-radius:9px;padding:14px 16px;overflow-x:auto;font:13.5px/1.55 var(--mono);color:#cfd6e0}
pre.code .cap{position:absolute;top:6px;right:10px;font-size:10px;color:var(--tx3);text-transform:lowercase}
.k{color:#c79bff}.s{color:#9fd78a}.c{color:#5d6b7a;font-style:italic}.n{color:#f5a97f}.pp{color:#f07f9a}.t{color:#6cc6ff}.f{color:#f2d47a}
.ln{display:block;padding:0 6px;margin:0 -6px;border-radius:3px}
.ln.hi{background:#f0b23e26;box-shadow:inset 2px 0 var(--amb)}

/* quiz */
.q{border:1px solid var(--line2);border-radius:12px;background:var(--bg2);padding:16px 18px}
.q .qh{font-family:var(--mono);font-size:11px;color:var(--vio);letter-spacing:.06em;margin-bottom:6px}
.q .qt{font-size:17px;margin:4px 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg3);border:1px solid var(--line);color:var(--tx);padding:10px 12px;border-radius:8px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--tx3)}
.opt .ix{font-family:var(--mono);font-size:12px;color:var(--tx3);padding-top:2px}
.opt code{font-size:13.5px}
.opt.ok{border-color:var(--teal);background:var(--teal2)}
.opt.bad{border-color:var(--red);background:var(--red2)}
.opt:disabled{cursor:default}
.why{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border:1px dashed var(--line2);font-size:15px}
.why .v{font-family:var(--mono);font-weight:700;margin-right:6px}
.why .v.ok{color:var(--teal)} .why .v.bad{color:var(--red)}
textarea,input[type=text],input[type=number],select{font:14px var(--mono);background:var(--bg);color:var(--tx);border:1px solid var(--line2);border-radius:7px;padding:8px 10px}
textarea{width:100%;min-height:84px;resize:vertical}
.recall .qh{color:var(--amb)}
.grades{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* widget frame */
.wg{border:1px solid var(--line2);border-radius:12px;background:var(--bg2);overflow:hidden}
.wg .wt{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--teal);background:#0f1318}
.wg .wt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}
.wg .wb{padding:16px}
.wg .hint{font-size:13px;color:var(--tx2);margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.col2{grid-template-columns:1fr} h1{font-size:30px}}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-family:var(--mono);background:var(--bg3);border:1px solid var(--line);padding:5px 10px;border-radius:6px;cursor:pointer;user-select:none;color:var(--tx2)}
.tog input{accent-color:var(--amb)}
.tog.on{border-color:var(--amb);color:var(--tx)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{background:var(--bg3);color:var(--tx2);border:0;padding:6px 11px;font:12px var(--mono);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--amb);color:#111;font-weight:700}
.out{font-family:var(--mono);font-size:13px;background:#0a0d11;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;min-height:40px}
.big{font-family:var(--mono);font-size:24px;font-weight:700}
.lab{font-family:var(--mono);font-size:11px;color:var(--tx3)}
table.t{border-collapse:collapse;width:100%;font-size:13px;font-family:var(--mono)}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.t th{background:var(--bg3);color:var(--tx2);font-weight:500}
.good{color:var(--teal)} .badc{color:var(--red)} .warn{color:var(--amb)}
.bytes{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;font-family:var(--mono);font-size:10px}
.by{height:30px;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;color:#111;font-weight:600}
.by.pad{background:repeating-linear-gradient(45deg,#2a1d1d,#2a1d1d 4px,#3a2323 4px,#3a2323 8px);color:var(--red)}
.mem{display:flex;flex-direction:column;gap:6px}
.mitem{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:13px}
.mitem .sw{width:12px;height:12px;border-radius:3px}
.mitem .sp{margin-left:auto;display:flex;gap:2px}
.mitem button{background:none;border:0;color:var(--tx3);padding:0 5px;font-size:14px}
.mitem button:hover{color:var(--tx)}
.log{font-family:var(--mono);font-size:13px;background:#0a0d11;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:120px;max-height:260px;overflow:auto}
.log div{animation:rise .25s ease both}
.cell{display:inline-flex;align-items:center;justify-content:center;width:44px;height:38px;margin:2px;border-radius:5px;font-family:var(--mono);font-size:12px;background:var(--bg3);border:1px solid var(--line)}
.cell.f{background:#5ec8b833;border-color:var(--teal)}
.cell.cap{border-style:dashed}
.flash{animation:flash .6s ease}
@keyframes flash{0%{background:var(--amb)}100%{}}
.thr{border:1px solid var(--line);border-radius:9px;padding:10px;background:#0a0d11}
.thr h4{margin:0 0 6px;font-family:var(--mono);font-size:12px;color:var(--tx2);font-weight:500;display:flex;justify-content:space-between}
.ins{font-family:var(--mono);font-size:13px;padding:2px 6px;border-radius:4px;color:var(--tx3)}
.ins.cur{background:#f0b23e26;color:var(--tx);box-shadow:inset 2px 0 var(--amb)}
.ins.done{color:var(--tx3);text-decoration:line-through}
.ins.blk{background:var(--red2);color:var(--red);box-shadow:inset 2px 0 var(--red)}
.banner{padding:10px 14px;border-radius:8px;font-family:var(--mono);font-size:13px;margin-top:10px}
.banner.bad{background:var(--red2);border:1px solid #ff6b6b66;color:#ffb3b3}
.banner.ok{background:var(--teal2);border:1px solid #5ec8b866;color:#b8efe6}
.banner.info{background:var(--vio2);border:1px solid #a99cff55;color:#d6d0ff}
input[type=range]{accent-color:var(--amb);width:100%}

/* review */
.card{border:1px solid var(--line2);background:var(--bg2);border-radius:14px;padding:28px;min-height:220px}
.card .front{font-family:var(--serif);font-size:23px;line-height:1.4}
.card .back{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line2);font-size:16px}
.foot{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--tx3)}
.toc{columns:2;column-gap:28px} .toc li{break-inside:avoid}
.fin{border:1px solid #5ec8b855;background:var(--teal2);border-radius:12px;padding:18px 20px;margin-top:30px}
</style></head>
<body>
<div id="prog" class="prog"></div>
<header class="top"><a class="brand" href="#map">c++<b>::</b>dojo</a>
<nav><a href="#map">map</a><a href="#review">review<span id="duepill" class="pill z">0</span></a><a href="#mix">drill</a><a href="#index">index</a></nav></header>
<div id="app"></div>
<script>
"use strict";
/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const C = String.raw;
const DAY = 864e5;

/* ---------- c++ highlighter ---------- */
const KW = new Set(("alignas alignof auto bool break case catch char char8_t class concept const consteval constexpr constinit const_cast continue co_await co_return co_yield decltype default delete do double dynamic_cast else enum explicit export extern false float for friend goto if inline int long mutable namespace new noexcept nullptr operator private protected public reinterpret_cast requires return short signed sizeof static static_assert static_cast struct switch template this thread_local throw true try typedef typeid typename union unsigned using virtual void volatile while override final").split(" "));
const TY = new Set(("std size_t string vector map unordered_map list deque array optional variant any unique_ptr shared_ptr weak_ptr thread mutex atomic lock_guard scoped_lock unique_lock condition_variable future promise async move forward int8_t uint8_t int32_t uint64_t string_view function boost T U Args").split(" "));
function hl(src) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])')|(^[ \t]*#[a-z]+)|(\b\d[\d.']*(?:[uUlLfF]|ms|s)*\b)|([A-Za-z_]\w*)/gm;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const tok = esc(m[0]);
    if (m[1]) out += `<span class="c">${tok}</span>`;
    else if (m[2]) out += `<span class="s">${tok}</span>`;
    else if (m[3]) out += `<span class="pp">${tok}</span>`;
    else if (m[4]) out += `<span class="n">${tok}</span>`;
    else if (KW.has(m[0])) out += `<span class="k">${tok}</span>`;
    else if (TY.has(m[0])) out += `<span class="t">${tok}</span>`;
    else if (src[re.lastIndex] === "(") out += `<span class="f">${tok}</span>`;
    else out += tok;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeBlock(src, cap, hiLines) {
  const lines = hl(src.replace(/^\n/, "").replace(/\s+$/, "")).split("\n");
  const pre = h("pre", { class: "code" });
  pre.innerHTML = (cap ? `<span class="cap">${esc(cap)}</span>` : "") +
    lines.map((l, i) => `<span class="ln${hiLines && hiLines.includes(i + 1) ? " hi" : ""}" data-l="${i + 1}">${l || " "}</span>`).join("");
  return pre;
}
/* inline markdown-ish: `code`, **bold**, *em* */
function md(s) {
  return String(s).split(/(`[^`]+`)/).map(p => (p.length > 1 && p[0] === "`" && p.endsWith("`")) ? `<code>${esc(p.slice(1, -1))}</code>` :
    esc(p).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\s][^*]*?)\*/g, "$1<em>$2</em>").replace(/\n/g, "<br>")).join("");
}

/* ---------- persistence (try/catch: storage may be unavailable) ---------- */
const KEY = "cpp-dojo-v1";
const S = (() => {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { }
  d = d || {};
  return Object.assign({ done: {}, beat: {}, ans: {}, cards: {}, stats: { n: 0, ok: 0 }, days: [] }, d);
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function touchDay() {
  const t = new Date().toISOString().slice(0, 10);
  if (!S.days.includes(t)) { S.days.push(t); S.days = S.days.slice(-400); save(); }
}
function streak() {
  let n = 0, d = new Date();
  for (; ;) {
    const t = d.toISOString().slice(0, 10);
    if (S.days.includes(t)) { n++; d = new Date(d - DAY); }
    else if (n === 0 && t === new Date().toISOString().slice(0, 10)) { d = new Date(d - DAY); }
    else break;
  }
  return n;
}

/* ---------- content registry ---------- */
const TRACKS = [];   // {id,title,desc,lessons:[]}
const LESSONS = {};  // id -> lesson
const ORDER = [];
function track(t) { t.lessons = []; TRACKS.push(t); }
function lesson(L) {
  const t = TRACKS[TRACKS.length - 1];
  L.track = t.id; L.trackTitle = t.title;
  t.lessons.push(L); LESSONS[L.id] = L; ORDER.push(L.id);
}
const WIDGETS = {};

/* ---------- spaced repetition (leitner-ish) ---------- */
const BOX = [0, 1, 2, 4, 8, 16, 35, 75, 150];
function allCards() {
  const r = [];
  for (const id of ORDER) LESSONS[id].cards.forEach((c, i) => r.push({ key: id + ":" + i, lid: id, q: c[0], a: c[1] }));
  return r;
}
function enroll(lid) {
  LESSONS[lid].cards.forEach((c, i) => { const k = lid + ":" + i; if (!S.cards[k]) S.cards[k] = { box: 0, due: Date.now() + 6 * 3600e3 }; });
}
function dueCards() { const now = Date.now(); return allCards().filter(c => S.cards[c.key] && S.cards[c.key].due <= now); }
function grade(key, g) {
  const c = S.cards[key]; if (!c) return;
  if (g === 0) { c.box = 0; c.due = Date.now() + 10 * 60e3; }
  else if (g === 1) { c.box = Math.max(1, c.box); c.due = Date.now() + Math.max(1, BOX[c.box] / 2) * DAY; }
  else { c.box = Math.min(BOX.length - 1, c.box + (g === 3 ? 2 : 1)); c.due = Date.now() + BOX[c.box] * DAY; }
  touchDay(); save();
}

/* ---------- routing ---------- */
const app = () => $("#app");
function go(hash) { location.hash = hash; }
window.addEventListener("hashchange", route);
function route() {
  const hsh = location.hash.slice(1);
  $$(".top nav a").forEach(x => x.classList.toggle("on", x.getAttribute("href") === "#" + (hsh || "map")));
  updatePill();
  window.scrollTo(0, 0);
  $("#prog").style.width = "0";
  if (hsh.startsWith("l-") && LESSONS[hsh.slice(2)]) return viewLesson(LESSONS[hsh.slice(2)]);
  if (hsh === "review") return viewReview();
  if (hsh === "mix") return viewMix();
  if (hsh === "index") return viewIndex();
  return viewHome();
}
function updatePill() {
  const n = dueCards().length;
  const p = $("#duepill"); p.textContent = n; p.className = "pill" + (n ? "" : " z");
}

/* ---------- home ---------- */
function lessonState(id) {
  if (S.done[id]) return "d";
  return S.beat[id] ? "p" : "";
}
function nextLesson() { return ORDER.find(id => !S.done[id]) || ORDER[0]; }
function viewHome() {
  const done = ORDER.filter(id => S.done[id]).length;
  const acc = S.stats.n ? Math.round(100 * S.stats.ok / S.stats.n) + "%" : "—";
  const due = dueCards().length;
  const nx = LESSONS[nextLesson()];

}

    const addSel = h("select", {}, Object.keys(LT).map(k => h("option", { value: k }, k)));

      });

    draw();
  }
};

/* --- template instantiation vs runtime recursion --- */
WIDGETS.fib = {
  title: "instantiation is memoized",
  mount(el) {
    let N = 6;
    const out = h("div", {}), tree = h("div", { class: "out", style: "max-height:220px;overflow:auto;font-size:11px" });
    const calls = n => { const a = [1, 1]; for (let i = 2; i <= n; i++) a[i] = a[i - 1] + a[i - 2] + 1; return a[n]; };
    const fib = n => { let a = 0, b = 1; for (let i = 0; i < n; i++) [a, b] = [b, a + b]; return a; };
    function rt(n, d, seen, lines) {
      if (lines.length > 200) return;
      const dup = seen.has(n); seen.add(n);
      lines.push("  ".repeat(d) + `fib(${n})` + (dup ? "   ← recomputed" : ""));
      if (n > 1) { rt(n - 1, d + 1, seen, lines); rt(n - 2, d + 1, seen, lines); }
    }
    const sl = h("input", { type: "range", min: 2, max: 40, value: N });

        <div><div class="lab">naive runtime calls</div><div class="big badc">${calls(N).toLocaleString()}</div></div></div>`;
      const lines = []; rt(Math.min(N, 7), 0, new Set(), lines);
      tree.textContent = (N > 7 ? `(runtime tree shown for N=7; yours is ${calls(N).toLocaleString()} calls)\n` : "") + lines.join("\n");

    el.append(h("p", { class: "hint" }, "Fib<N-1> and Fib<N-2> both need Fib<N-3>, but a class template specialization is instantiated once per translation unit, then reused. the compiler memoizes for free."),

template<> struct Fib<1> { static constexpr unsigned long long value = 1; };
template<> struct Fib<0> { static constexpr unsigned long long value = 0; };`), sl, out, h("div", { class: "lab" }, "naive runtime recursion, for contrast"), tree);

      },

WIDGETS.amdahl = {
  title: "amdahl's law",
  mount(el) {
    let p = .9, n = 8;
    const sp = h("input", { type: "range", min: 0, max: 100, value: 90 }), sn = h("input", { type: "range", min: 1, max: 128, value: 8 });
    const out = h("div", {}), svg = h("div", {});
    const S = (p, n) => 1 / ((1 - p) + p / n);
    function draw() {
      out.innerHTML = `<div class="row" style="gap:26px;margin:10px 0"><div><div class="lab">parallel fraction p</div><div class="big">${Math.round(p * 100)}%</div></div>
      <div><div class="lab">cores n</div><div class="big">${n}</div></div><div><div class="lab">speedup</div><div class="big warn">${S(p, n).toFixed(2)}×</div></div>
      <div><div class="lab">ceiling (n→∞)</div><div class="big badc">${p < 1 ? (1 / (1 - p)).toFixed(1) + "×" : "∞"}</div></div><div><div class="lab">efficiency</div><div class="big">${Math.round(100 * S(p, n) / n)}%</div></div></div>`;
      const W = 520, H = 160, mx = 128, my = Math.min(64, Math.max(4, p < 1 ? 1 / (1 - p) * 1.15 : 64));
      const pts = Array.from({ length: mx }, (_, i) => `${(i / (mx - 1)) * W},${H - Math.min(H, S(p, i + 1) / my * H)}`).join(" ");
      const ideal = `0,${H - 1 / my * H} ${Math.min(W, (my - 1) / (mx - 1) * W)},0`;
      svg.innerHTML = `<svg viewBox="-30 -8 ${W + 40} ${H + 26}" style="width:100%;max-width:600px">
        <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#33404f"/><line x1="0" y1="0" x2="0" y2="${H}" stroke="#33404f"/>
        <polyline points="${ideal}" fill="none" stroke="#6b7684" stroke-dasharray="4 4"/>
        <polyline points="${pts}" fill="none" stroke="#f0b23e" stroke-width="2.5"/>
        <circle cx="${(n - 1) / (mx - 1) * W}" cy="${H - S(p, n) / my * H}" r="5" fill="#5ec8b8"/>
        <text x="${W}" y="${H + 16}" fill="#6b7684" font-size="10" text-anchor="end" font-family="monospace">cores → 128</text>
        <text x="-6" y="6" fill="#6b7684" font-size="10" text-anchor="end" font-family="monospace">${my.toFixed(0)}×</text>
        <text x="40" y="12" fill="#6b7684" font-size="10" font-family="monospace">dashed = linear (ideal)</text></svg>`;
    }
    sp.addEventListener("input", () => { p = sp.value / 100; draw(); }); sn.addEventListener("input", () => { n = +sn.value; draw(); });
    el.append(h("p", { class: "hint" }, "speedup = 1 / ((1−p) + p/n). set p = 95% and drag cores to 128. then ask what the serial 5% is in your code (allocation? a lock? i/o?)."),
      h("div", { class: "col2" }, h("div", {}, h("div", { class: "lab" }, "p"), sp), h("div", {}, h("div", { class: "lab" }, "n"), sn)), out, svg);
    draw();
  }
};

lesson({
  id: "lifetime", title: "lifetime & raii", widgetLabel: "stepper",
  src: ["c++: the core language · ch 6 ctors & dtors", "inside the c++ object model · ch 5–6", "boost c++ libraries · ch 3 memory & exception safety"],
  hook: "c++ has no `finally`, no garbage collector, and almost never leaks in well-written code. **how?** the answer is a scheduling guarantee you get for free on every closing brace.",
  beats: [
    { t: "p", h: "an object's lifetime is a closed interval: it begins when its constructor *finishes*, ends when its destructor *starts*. for automatic (stack) objects, the compiler schedules the destructor call at scope exit — on every path out: normal `}`, `return`, `break`, or an exception unwinding through." },
    { t: "p", h: "construction is built bottom-up, destruction exactly mirrors it: **bases first, then members in declaration order, then the constructor body.** destruction runs the reverse. locals in a scope die in reverse order of declaration." },
    {
      t: "w", id: "stepper", cfg: {
        code: C`struct Log { std::string n;
  Log(std::string s) : n(s) { say(n + "()"); }
  ~Log()                    { say("~" + n + "()"); } };

struct Base { Log b{"Base.b"};
  Base()  { say("Base body"); }
  ~Base() { say("~Base body"); } };

struct Widget : Base {
  Log m1{"m1"};
  Log m2{"m2"};
  Widget()  { say("Widget body"); }
  ~Widget() { say("~Widget body"); } };

int main() {
  Log a{"a"};
  Widget w;
}`, steps: [
          { l: [17], log: "a()", note: "locals construct in order of appearance." },
          { l: [10, 5], log: "Base.b()", note: "constructing `w`: the base subobject comes first, and *its* members come before *its* body." },
          { l: [6], log: "Base body", note: "base ctor body runs after base's members." },
          { l: [11], log: "m1()", note: "now Widget's members — in DECLARATION order, regardless of how you order the mem-init list." },
          { l: [12], log: "m2()" },
          { l: [13], log: "Widget body", note: "the body runs last. by now every subobject is alive, so the body can use them." },
          { l: [19], log: "~Widget body", note: "closing brace. `w` was declared last, so it dies first. destructor body runs FIRST in destruction…" },
          { l: [12], log: "~m2()", note: "…then members in reverse declaration order…" },
          { l: [11], log: "~m1()" },
          { l: [7], log: "~Base body", note: "…then the base: body first, then its members." },
          { l: [5], log: "~Base.b()" },
          { l: [17], log: "~a()", note: "finally `a`. perfect mirror image. this determinism is what RAII is built on." },
        ]
      }
    },
    { t: "p", h: "**raii** = resource acquisition is initialization: tie each resource (memory, file, lock, socket, transaction) to an object whose destructor releases it. then the compiler's scheduling guarantee *becomes* your cleanup guarantee — even on exceptions." },
    { t: "code", c: C`void bad(std::mutex& m) {
  m.lock();
  risky();        // throws → m stays locked forever
  m.unlock();
}
void good(std::mutex& m) {
  std::lock_guard<std::mutex> g(m);   // ctor locks
  risky();                            // throws → g's dtor unlocks during unwinding
}`, cap: "the whole idea in 9 lines" },
    {
      t: "q", code: C`struct A { A(){ std::cout << "A"; } ~A(){ std::cout << "~A"; } };
struct B { B(){ std::cout << "B"; throw 1; } ~B(){ std::cout << "~B"; } };
struct C { A a; B b; };
int main() { try { C c; } catch (int) { std::cout << " caught"; } }`,
      q: "what prints?", o: ["`AB~B~A caught`", "`AB~A caught`", "`AB caught`", "`AB~A~B caught`"], a: 1,
      why: "B's constructor never finished, so B's lifetime never began → no ~B. but `a` was fully constructed, so the partially-built C unwinds it: ~A runs. C's own destructor does NOT run (C never finished either). this is why each resource should be owned by its own member, not by C's body."
    },
    { t: "edge", h: "a destructor that throws during stack unwinding (i.e. while another exception is in flight) calls `std::terminate`. since c++11 destructors are implicitly `noexcept`, so *any* throw out of a destructor terminates unless you opt out. don't." },
    {
      t: "q", code: C`struct Mem { int x; Mem(int v) : x(v) {} };
struct S {
  Mem a, b;
  S() : b(1), a(b.x + 1) {}
};`, q: "what's `a.x` after `S s;`?", o: ["2", "1", "garbage: reads b before b is constructed (UB)", "compile error"], a: 2,
      why: "members are initialized in DECLARATION order (a, then b), not mem-init-list order. so `a(b.x + 1)` reads `b` before its lifetime begins. gcc/clang warn with -Wreorder; your code review should not need the warning."
    },
    { t: "rule", h: "declare members in the order they depend on each other, and write the mem-init list in the same order. treat -Wreorder as an error." },
    { t: "recall", q: "state the complete construction order for a derived class with members, and why destruction is the exact reverse.", a: "bases (in declaration order, recursively — each base's own bases, members, body), then members in declaration order, then the ctor body. destruction reverses it so that every subobject is still alive while anything that might depend on it is being torn down — a member can rely on bases; the body can rely on all members." },
  ],
  cards: [
    ["when does an object's lifetime begin and end?", "begins when its constructor completes; ends when its destructor starts. a ctor that throws means the object never existed → its dtor never runs."],
    ["in what order are members initialized?", "declaration order in the class — NOT the order of the mem-init list."],
    ["what does RAII buy you that try/finally doesn't?", "cleanup is bound to the type, not to each call site; it runs on every exit path including exceptions; it composes (members of members) with zero extra code."],
    ["why are destructors implicitly noexcept, and what happens if one throws during unwinding?", "throwing while another exception is propagating can't be handled → std::terminate. c++11 made dtors noexcept by default so any throw terminates immediately."],
    ["if member b's ctor throws while constructing object c (members a, b), which dtors run?", "only ~a (a was fully constructed). not ~b, not ~C."],
  ]
});

lesson({
  id: "layout", title: "layout, padding & size", widgetLabel: "layout lab",
  src: ["inside the c++ object model · ch 1, 3 data semantics", "c++ high performance · ch 4 data structures, ch 7 memory"],
  hook: "`struct { char a; int b; char c; }` holds 6 bytes of data. `sizeof` says 12. **where did the other 6 go — and why would the compiler do that to you?**",
  beats: [
    { t: "p", h: "every type has an **alignment**: its address must be a multiple of it. an `int` (4) can't start at address 1. so the compiler inserts **padding** between members to align the next one, and at the end so that in an *array* of structs, element `[1]` is aligned too." },
    { t: "p", h: "c++ forbids reordering members (with the same access level) — declaration order is address order. so the layout is *your* decision, and the compiler pads around it. the object-model book's point: a C struct and a c++ class with non-virtual member functions have identical layout. functions aren't stored in objects. what costs bytes is data, padding, and virtual machinery." },
    { t: "w", id: "layout", cfg: { init: [["char", "a"], ["int", "b"], ["char", "c"], ["double", "d"], ["bool", "e"]] } },
    { t: "rule", h: "sort members by alignment, largest first. it's not always optimal, but it's always ≤ the original and usually zero-pad." },
    {
      t: "q", q: "`struct S { double d; char c; };` — what is `sizeof(S[2])`?", o: ["18", "9", "32", "16"], a: 2,
      why: "sizeof(S) = 8 + 1 + 7 tail padding = 16. tail padding exists precisely so arrays work: S[1].d must sit on an 8-byte boundary. 2 × 16 = 32."
    },
    {
      t: "q", code: C`struct Empty {};
struct A { Empty e; int x; };
struct B : Empty { int x; };`, q: "sizeof(Empty), sizeof(A), sizeof(B)?", o: ["0, 4, 4", "1, 8, 4", "1, 5, 5", "1, 8, 8"], a: 1,
      why: "an empty class has size 1 (distinct objects need distinct addresses). as a *member* it occupies 1 byte, then int needs 3 bytes pad → 8. as a *base*, the empty base optimization lets it take zero bytes → 4. this is why policy classes and allocators/deleters are inherited (or marked [[no_unique_address]] in c++20) rather than stored as members."
    },
    { t: "edge", h: "adding *one* virtual function adds a vptr (8 bytes on 64-bit) to every object and makes the class non-trivially-copyable — no more memcpy, no more `std::is_trivial`. toggle 'has virtual fn' in the lab and look what happens to a `struct { char c; }`." },
    {
      t: "q", q: "you have 10 million `struct { bool alive; double x; bool dirty; double y; }`. what's the cheapest win?", o: ["mark it packed", "reorder to doubles first: 32 → 24 bytes, 25% less memory traffic", "use float", "it's already optimal"], a: 1,
      why: "8+8+8+8 = 32 with padding after each bool. reordered: 8+8+1+1+6 tail = 24. #pragma pack would make 18 but creates misaligned double loads (slow on some cpus, UB-ish via references, breaks atomics). reorder first, pack never (unless it's a wire format)."
    },
    { t: "recall", q: "why does tail padding exist, and what would break without it?", a: "so that sizeof(T) is a multiple of alignof(T). arrays are contiguous with stride sizeof(T); without tail padding, element [1] would be misaligned." },
  ],
  cards: [
    ["what is alignment and who decides it?", "the address multiple a type must start on. the ABI decides per type (int: 4, double: 8 on x86-64). alignof(T) tells you."],
    ["why is sizeof an empty class 1?", "two distinct objects must have distinct addresses; size 0 would break arrays and pointer identity."],
    ["what is the empty base optimization?", "an empty base class subobject can occupy zero bytes. members can't (pre-c++20), so stateless policies/deleters/allocators are inherited or [[no_unique_address]]."],
    ["cheapest rule to minimize padding?", "order members by decreasing alignment."],
    ["what does adding the first virtual function cost per object?", "a vptr (8 bytes on 64-bit), plus losing trivial copyability."],
  ]
});

lesson({
  id: "vtable", title: "virtual dispatch, for real", widgetLabel: "vtable explorer",
  src: ["inside the c++ object model · ch 4 function semantics, ch 5", "c++: the core language · ch 12–13 polymorphism"],
  hook: "`p->f()` — the compiler doesn't know which `f` you mean. at runtime, nothing stores a type name. **so what, physically, picks the function?**",
  beats: [
    { t: "p", h: "each polymorphic class gets one static table of function pointers: the **vtable**. each object gets a hidden pointer to its class's table: the **vptr**. a virtual call compiles to: load vptr, load slot *k*, call indirectly. the slot index is fixed at compile time from the *static* type; which table you land in depends on the *dynamic* type." },
    { t: "w", id: "vtable" },
    { t: "p", h: "the constructor of each class sets the vptr to *its own* vtable, before running its body. so during `Base::Base()` the object really *is* a Base — the Derived part hasn't been built. calling a virtual from a constructor dispatches to the Base version. this isn't a bug; the alternative would be calling a Derived method on uninitialized Derived members." },
    {
      t: "q", code: C`struct B {
  B() { hello(); }
  virtual void hello() { std::cout << "B"; }
};
struct D : B {
  std::string s = "D";
  void hello() override { std::cout << s; }
};
int main() { D d; d.hello(); }`, q: "output?", o: ["`DD`", "`BD`", "`BB`", "crash"], a: 1,
      why: "inside B() the vptr points to B's vtable → B::hello. after D() finishes, the vptr points to D's → D::hello. (if B::hello were pure virtual, the call from the ctor is UB and typically aborts with 'pure virtual method called'.)"
    },
    {
      t: "q", code: C`struct B { virtual void f(int x = 1) { std::cout << "B" << x; } };
struct D : B { void f(int x = 2) override { std::cout << "D" << x; } };
int main() { B* p = new D; p->f(); }`, q: "output?", o: ["`D2`", "`D1`", "`B1`", "`B2`"], a: 1,
      why: "the function is chosen dynamically (D::f), but default arguments are a compile-time substitution based on the STATIC type (B*) → x = 1. never redefine default args in overrides."
    },
    {
      t: "q", code: C`struct Base { ~Base() { /* ... */ } virtual void f(); };
struct Derived : Base { std::vector<int> v; };
Base* p = new Derived;
delete p;`, q: "what happens?", o: ["fine — Derived's vector is freed", "undefined behavior", "compile error", "leaks v but otherwise fine"], a: 1,
      why: "deleting through a base pointer whose destructor isn't virtual is UB, period — not 'just a leak'. in practice ~Derived is skipped (v leaks) and if Base isn't the first subobject, the wrong address is freed. rule: polymorphic base → public virtual dtor, or protected non-virtual dtor."
    },
    {
      t: "q", code: C`struct Animal { virtual std::string name() const { return "animal"; } };
struct Cat : Animal { std::string name() const override { return "cat"; } };
void show(Animal a) { std::cout << a.name(); }
int main() { Cat c; show(c); }`, q: "output?", o: ["`cat`", "`animal`", "compile error", "UB"], a: 1,
      why: "slicing. pass-by-value copy-constructs an Animal from the Animal part of c. the new object's vptr is Animal's. polymorphism lives only behind pointers and references."

lesson({
  id: "smartptr", title: "ownership & smart pointers", widgetLabel: "control block",
  src: ["effective modern c++ · items 18–22", "the c++ standard library · smart pointers", "boost c++ libraries · ch 3", "modern c++ design · ch 7"],
  hook: "you used `make_shared`. the object's destructor ran an hour ago. **its memory is still allocated.** what's holding it?",
  beats: [
    { t: "p", h: "ownership is a design question first: **unique_ptr** = exactly one owner, zero overhead (same size as a raw pointer with a stateless deleter), move-only. **shared_ptr** = shared ownership via a heap-allocated *control block* holding a strong count, a weak count, the deleter, and the allocator. **weak_ptr** = observes without owning; can ask 'still alive?'." },
    { t: "w", id: "sptr" },
    { t: "p", h: "`make_shared` puts the object inside the control block: one allocation instead of two, better locality. the price: the object's bytes can't be returned until the *weak* count also drops to zero, because the control block lives that long. big objects + long-lived weak_ptrs → use `shared_ptr<T>(new T)` instead." },
    {
      t: "q", code: C`auto* raw = new Widget;
std::shared_ptr<Widget> a(raw);
std::shared_ptr<Widget> b(raw);`, q: "what happens?", o: ["a and b share; count = 2", "double delete when both go out of scope (UB)", "compile error", "b throws"], a: 1,
      why: "each construction from a raw pointer creates a NEW control block. two blocks, each with count 1, each will delete raw. the same trap exists for `shared_ptr<T>(this)` inside a member — that's what enable_shared_from_this solves."
    },
    {
      t: "q", code: C`struct Node {
  std::shared_ptr<Node> next;
  std::shared_ptr<Node> prev;
};
{
  auto a = std::make_shared<Node>();
  auto b = std::make_shared<Node>();
  a->next = b; b->prev = a;
}`, q: "after the block, how many Node destructors have run?", o: ["2", "1", "0 — both leak", "UB"], a: 2,
      why: "a's count: local + b->prev = 2. scope exit → 1. same for b. neither hits zero; a cycle of strong refs is a leak. make back-pointers weak_ptr (or raw, if the lifetime is guaranteed by structure)."
    },
    {
      t: "q", q: "`sizeof(std::unique_ptr<int>)` vs `sizeof(std::unique_ptr<FILE, int(*)(FILE*)>)` on 64-bit?", o: ["8, 8", "8, 16", "16, 16", "8, 24"], a: 1,
      why: "a function-pointer deleter is state → stored → 16. a stateless lambda or empty functor deleter costs 0 thanks to EBO: `unique_ptr<FILE, decltype([](FILE* f){ fclose(f); })>` is 8 bytes (c++20 lambda in unevaluated context)."
    },
    { t: "edge", h: "shared_ptr's refcount is atomic, so copying one across threads is safe. the *pointee* is not protected at all, and the shared_ptr *object itself* is not safe to read+write from two threads (use `std::atomic<std::shared_ptr<T>>` in c++20). also: passing shared_ptr by value into every function costs two atomic RMWs per call. pass `T&` or `T*` unless the callee takes ownership." },

  cards: [
    ["what's in a shared_ptr control block?", "strong count, weak count, deleter, allocator (and with make_shared, the object itself)."],
    ["make_shared advantage and drawback?", "one allocation, better locality; but object memory isn't freed until all weak_ptrs are gone."],
    ["why is constructing two shared_ptrs from one raw pointer fatal?", "two independent control blocks → each deletes the object → double delete."],
    ["how do you break a shared_ptr cycle?", "make one direction weak_ptr (or a raw non-owning pointer)."],
    ["is shared_ptr thread-safe?", "the refcount is atomic. the pointee isn't protected; concurrent read/write of the same shared_ptr object needs atomic<shared_ptr>."],
    ["when is unique_ptr bigger than a raw pointer?", "when the deleter has state (e.g. function pointer). stateless deleters cost 0 via EBO."],

lesson({
  id: "cache", title: "the memory hierarchy", widgetLabel: "cache lines",
  src: ["c++ high performance · ch 3 measuring, ch 4 data structures, ch 7 memory", "c++ concurrency in action · ch 8.2–8.3"],
  hook: "two loops over the same 1 GB of data, same instruction count. one runs **10× slower**. no algorithmic difference. **what does big-O not see?**",
  beats: [
    { t: "p", h: "big-O counts operations. the hardware charges for **data movement**. rough orders of magnitude on a modern x86: L1 hit ~1 ns, L2 ~4 ns, L3 ~10–40 ns, DRAM ~80–100 ns. memory moves in 64-byte **cache lines**. and the prefetcher rewards predictable, sequential access while punishing pointer-chasing." },
    { t: "p", h: "so the question for a hot loop is: **of each 64-byte line I pay for, how many bytes do I use?**" },
    { t: "w", id: "cache" },
    { t: "code", c: C`// row-major 2d traversal: the classic
for (int i = 0; i < N; ++i)
  for (int j = 0; j < N; ++j)
    sum += m[i][j];      // sequential: 1 miss per 16 ints

for (int j = 0; j < N; ++j)
  for (int i = 0; i < N; ++i)
    sum += m[i][j];      // stride N*4 bytes: potentially 1 miss per int`, cap: "same O(n²). not the same program." },
    {
      t: "q", q: "summing 10M ints: `std::vector<int>` vs `std::list<int>`. same O(n). realistic ratio?", o: ["about equal", "list ~2× slower", "list often 10×+ slower", "list faster (no reallocation)"], a: 2,
      why: "vector: contiguous, prefetched, vectorizable (SIMD adds 8 ints per instruction). list: one dependent load per node, nodes scattered by the allocator → cache miss chain, no SIMD. plus each node is 24 bytes of overhead for 4 bytes of data."
    },
    {
      t: "q", q: "a hot `struct Order` has 6 fields the matching loop reads and 20 it never touches. best first move?", o: ["make the loop parallel", "split hot fields into their own array/struct (hot/cold splitting)", "mark the struct alignas(64)", "use a linked list"], a: 1,
      why: "hot/cold splitting raises bytes-used-per-line. alignas(64) just adds padding. parallelism on a memory-bound loop often gets nothing — the cores share the same memory bandwidth."
    },
    { t: "edge", h: "measure, don't reason. compilers vectorize, prefetchers detect strides, and turbo clocks lie. use a real benchmark harness (google benchmark), `perf stat -e cache-misses`, and look at the asm. the high-performance book's mantra: know your hot spots before you touch anything." },
    { t: "recall", q: "why can SoA beat AoS, and when doesn't it?", a: "SoA packs one field contiguously, so a loop touching few fields uses every byte of each fetched line (and vectorizes). when the loop touches most/all fields of each element, AoS has equal or better locality (one stream vs many)." },
  ],
  cards: [
    ["what unit does the cpu move memory in?", "cache lines — 64 bytes on mainstream x86/arm."],
    ["rough latency: L1 vs DRAM?", "~1 ns vs ~100 ns — two orders of magnitude."],
    ["why is std::list slow to traverse even though it's O(n)?", "each step is a dependent load from a scattered address → cache misses, no prefetching, no SIMD."],
    ["AoS vs SoA: when does SoA win?", "when hot loops touch a few fields of many elements."],
    ["what is hot/cold splitting?", "moving rarely-used fields out of a hot struct so each cache line carries more useful data."],
  ]
});

lesson({
  id: "alloc", title: "allocation is the hidden cost", widgetLabel: "sso",
  src: ["c++ high performance · ch 7 memory management", "modern c++ design · ch 4 small-object allocation", "the c++ standard library · strings, allocators"],
  hook: "your profiler says 30% of time is in `malloc`. you never call `malloc`. **who does, and how do you make them stop?**",
  beats: [
    { t: "p", h: "every `std::string` over a few chars, every `vector` growth, every `make_shared`, every `std::function` holding a big lambda — each is a general-purpose heap allocation: a lock or thread-cache lookup, size-class bookkeeping, and a fresh cache line you've never touched. the cheapest allocation is the one you don't make." },
    { t: "p", h: "**small buffer optimization**: store small payloads inside the object itself. `std::string` does it (SSO), `std::function` does it for small callables, and so does any good `small_vector`." },
    { t: "w", id: "sso" },
    { t: "p", h: "when you *must* allocate, change the allocator. alexandrescu's small-object allocator (modern c++ design ch. 4) pooled fixed-size chunks to beat the general heap; today's standard answer is `std::pmr`: polymorphic memory resources, swappable at runtime without changing the container's type." },
    { t: "code", c: C`#include <memory_resource>
char buf[64 * 1024];
std::pmr::monotonic_buffer_resource arena{buf, sizeof buf};
std::pmr::vector<std::pmr::string> names{&arena};   // strings inherit the arena too
for (auto& n : input) names.emplace_back(n);       // bump-pointer allocation
// all freed at once when arena dies — individual deallocate() is a no-op` },
    {
      t: "q", code: C`std::vector<std::string> v;
for (int i = 0; i < 1000; ++i)
  v.push_back("item-" + std::to_string(i));`, q: "approximately how many heap allocations (libstdc++)?", o: ["~1000", "~11 (vector growth only — every string fits SSO)", "~2000", "~3000"], a: 1,
      why: "\"item-999\" is 8 chars ≤ 15 → SSO, so strings don't allocate. vector grows 1,2,4,…,1024 → 11 allocations. call `reserve(1000)` → 1. change to a 20-char prefix and you add 1000 more."
    },
    {
      t: "q", q: "stack vs heap allocation: why is the stack nearly free?", o: ["stack memory is faster RAM", "allocation is a pointer bump of the stack register, release is implicit at scope exit, and the top of stack is almost always hot in cache", "the OS pre-zeroes it", "it isn't — same cost"], a: 1,
      why: "one `sub rsp, N` for the whole frame, no bookkeeping, no fragmentation, and you're writing to memory you just used. the limits: size (default 1–8 MB per thread) and lifetime (scope-bound)."
    },
    { t: "edge", h: "SSO makes moves *more* expensive for short strings: a moved-from short string must copy its inline bytes (there's no pointer to steal). 'moves are O(1)' is true; 'moves are free' is not." },
    { t: "recall", q: "name three standard-library operations that allocate implicitly, and a mitigation for each.", a: "vector growth → reserve. long string building → reserve / string_view / SSO-sized keys. std::function with a large capture → smaller capture, template parameter, or function_ref. make_shared/new in loops → object pool or pmr arena." },
  ],
  cards: [
    ["what is SSO?", "small string optimization: short strings are stored in the string object's own bytes, no heap allocation."],
    ["inline capacity of std::string on libstdc++ / libc++ / msvc (64-bit)?", "15 / 22 / 15 chars."],
    ["what is std::pmr::monotonic_buffer_resource?", "a bump allocator over a buffer; deallocation is a no-op; everything is released when the resource dies."],
    ["why is stack allocation nearly free?", "a single stack-pointer adjustment per frame, implicit release, and hot cache lines."],
    ["is moving a short std::string free?", "no — with SSO the inline bytes must be copied."],
  ]
});

lesson({
  id: "algos", title: "algorithms over loops",
  src: ["the c++ standard library · stl algorithms", "c++ high performance · ch 5–6 iterators, algorithms & ranges"],
  hook: "sean parent's challenge: *no raw loops*. sounds like dogma. **here's the version that isn't: a named algorithm states its complexity and its contract, and your loop doesn't.**",

    { t: "p", h: "the stl separates *data* (containers), *traversal* (iterators), and *operations* (algorithms). an algorithm is written once against an iterator category, so it works on everything that models it — and its complexity is guaranteed by the standard. knowing ~20 of them by heart is a superpower." },
    { t: "ul", items: ["`partition` / `stable_partition` — split by predicate, O(n)", "`nth_element` — put the k-th element in place, smaller before, larger after, average O(n) — medians, top-k", "`partial_sort` — sort only the first k, O(n log k)", "`lower_bound` / `upper_bound` / `equal_range` — binary search on *sorted* ranges", "`rotate` — the secret engine behind 'move this block over there' (slide, gather)", "`unique` — remove *adjacent* duplicates (sort first)", "`transform_reduce` — map-reduce, parallelizable"] },
    {
      t: "q", q: "you need the median of 10M unsorted doubles, once. best tool?", o: ["std::sort then index n/2 — O(n log n)", "std::nth_element at n/2 — average O(n)", "std::partial_sort to n/2", "a std::multiset"], a: 1,
      why: "nth_element does exactly the work needed and no more (introselect). sorting does log n times more work to produce an ordering you throw away."
    },
    {
      t: "q", q: "you want the 10 largest of 10M items, in order.", o: ["sort descending, take 10", "partial_sort with greater<> on the first 10 — O(n log 10)", "nth_element only", "priority_queue of all 10M"], a: 1,
      why: "partial_sort keeps a heap of k; ~n·log k comparisons. (nth_element + sort of the top 10 also works, and is often faster in practice. both beat a full sort.)"
    },
    {
      t: "q", code: C`std::list<int> l = /* 1M sorted ints */;
auto it = std::lower_bound(l.begin(), l.end(), 42);`, q: "complexity?", o: ["O(log n) — it's binary search", "O(log n) comparisons but O(n) iterator steps", "doesn't compile", "O(n log n)"], a: 1,
      why: "lower_bound works on forward iterators: it does log n comparisons but must *walk* to each midpoint with ++ — linear total. the algorithm's guarantees are stated in terms of the iterator category you give it."
    },

      t: "q", code: C`std::vector<int> v{3, 1, 3, 1, 2};
v.erase(std::unique(v.begin(), v.end()), v.end());
// v is now?`, q: "result?", o: ["{1, 2, 3}", "{3, 1, 3, 1, 2}", "{3, 1, 2}", "{1, 3}"], a: 1,

lesson({
  id: "traits", title: "traits, sfinae & concepts",
  src: ["c++ template metaprogramming · ch 2 traits", "advanced c++ metaprogramming · ch 4 overload resolution", "effective modern c++ · item 27", "c++ high performance · ch 8 type traits"],
  hook: "you want `print(x)` to call `.size()` if it exists, and do something else otherwise. **how do you branch on a property of a type that might not even compile?**",
  beats: [
    { t: "p", h: "**type traits** are metafunctions that inspect or transform types: `is_integral<T>`, `remove_reference_t<T>`, `decay_t<T>`. they're how generic code asks questions. the trick that makes *conditional* code possible is **SFINAE**: substitution failure is not an error. if plugging T into a function template's signature produces invalid code, that overload is silently dropped." },
    { t: "code", c: C`// c++11 sfinae: the overload exists only if t.size() is valid
template<class T>
auto len(const T& t) -> decltype(t.size()) { return t.size(); }
std::size_t len(...) { return 0; }

// c++17: if constexpr discards the untaken branch
template<class T> auto len2(const T& t) {
  if constexpr (requires { t.size(); }) return t.size();   // (c++20 requires-expr)
  else return std::size_t{0};
}

// c++20: concepts name the requirement
template<class T> concept Sized = requires(const T& t) { t.size(); };
std::size_t len3(const Sized auto& t) { return t.size(); }` },
    {
      t: "q", code: C`template<class T> auto len(const T& t) {
  if (std::is_integral_v<T>) return 1;
  else return t.size();
}
len(5);`, q: "what happens?", o: ["returns 1", "compile error", "returns 0", "UB"], a: 1,
      why: "a plain `if` compiles both branches for T=int. `t.size()` on an int is ill-formed → hard error (not SFINAE — we're in the body). and the two returns deduce different types. `if constexpr` discards the untaken branch for that instantiation."
    },
    {
      t: "q", code: C`static_assert(std::is_same_v<std::remove_const_t<const int*>, int*>);`, q: "does it pass?", o: ["yes", "no"], a: 1,
      why: "`const int*` is a non-const pointer to const int. the const is low-level; remove_const strips only top-level const (it would turn `int* const` into `int*`). result: `const int*`. traits are precise; your intuition is not."
    },
    {
      t: "q", code: C`void f(int);  void f(long);  void f(double);
f('a'); f(1u);`, q: "which overloads are selected?", o: ["f(int), f(long)", "f(int), then ambiguous for 1u", "f(double), f(double)", "f(int), f(int)"], a: 1,
      why: "'a' → int is a *promotion* (better than conversion). unsigned → int, → long, → double are all *conversions* of the same rank → ambiguous. overload resolution ranks: exact > promotion > conversion > user-defined > ellipsis. sfinae and tag dispatch lean on these ranks."
    },
    {
      t: "q", code: C`template<class T> concept Small = sizeof(T) <= 8;
void g(Small auto x) { std::cout << "small"; }
void g(auto x)       { std::cout << "any";   }
g(1); g(std::string{});`, q: "output (64-bit libstdc++)?", o: ["`smallany`", "`anyany`", "ambiguous", "`smallsmall`"], a: 0,
      why: "both are viable for int; the constrained one is *more specialized* (subsumption) so it wins. std::string is 32 bytes → only the unconstrained one is viable."
    },
    { t: "edge", h: "sfinae only applies in the *immediate context* — the declaration's signature. if substitution succeeds there but the body fails, you get a hard error deep inside the template. the metaprogramming books dedicate a whole chapter to deciphering those 'error novels'; concepts exist largely to move failures to the call site." },
    { t: "rule", h: "c++20: concepts. c++17: `if constexpr` + `std::void_t`/`enable_if`. c++11: `enable_if` / expression sfinae / tag dispatch. reach for the newest you're allowed." },
    { t: "recall", q: "what is SFINAE and where exactly does it apply?", a: "substitution failure is not an error: when substituting deduced template arguments into a function template's declaration (return type, params, template params, default args) yields invalid types/expressions, the candidate is removed from the overload set instead of erroring. it applies only in that immediate context, not inside the body." },
  ],
  cards: [

    ["difference between if and if constexpr in a template?", "if constexpr discards the untaken branch at instantiation, so it needn't compile for that T."],
    ["what does remove_const do to `const int*`?", "nothing — that const is low-level. it strips top-level only."],
    ["overload resolution ranking?", "exact match > promotion > standard conversion > user-defined conversion > ellipsis."],
    ["how does a concept-constrained overload win against an unconstrained one?", "partial ordering by constraints (subsumption): the more constrained is more specialized."],
  ]
});

lesson({

lesson({

    { t: "p", h: "`counter++` is three machine-level steps: load into a register, add, store back. if two threads interleave those steps, one increment overwrites the other. the c++ standard goes further: two unsynchronized accesses to the same memory location, at least one a write, is a **data race**, and a data race is **undefined behavior** — the compiler may assume it never happens (and e.g. keep counter in a register for the whole loop)." },
    { t: "w", id: "threads", cfg: { scenario: "race" } },
    { t: "p", h: "two fixes with different costs: a **mutex** makes the read-modify-write a critical section (blocking, works for any amount of code). an **atomic** makes a single operation indivisible in hardware (`lock xadd` on x86) — no blocking, but only for that one operation." },

      t: "q", code: C`void work();
int main() {

}   // t goes out of scope here`, q: "what happens at the closing brace?", o: ["main waits for work() to finish", "the thread is detached automatically", "std::terminate is called", "nothing"], a: 2,

int main() {

  std::thread t(inc, n);
  t.join();
}`, q: "what happens?", o: ["n == 1", "n == 0", "compile error", "UB"], a: 2,
      why: "std::thread copies (decays) its arguments into internal storage and passes them as rvalues. an rvalue int can't bind to int&. pass `std::ref(n)` — and then *you* own the lifetime problem."
    },

      t: "q", code: C`bool done = false;     // plain bool
// thread A:
while (!done) { }
// thread B:
done = true;`, q: "with optimization on, thread A…", o: ["exits shortly after B writes", "may spin forever: data race → UB; the compiler can hoist the load out of the loop", "exits immediately", "crashes"], a: 1,

lesson({

lesson({
  id: "waiting", title: "waiting: condvars & futures",
  src: ["c++ concurrency in action · ch 4", "effective modern c++ · items 35–39"],
  hook: "the consumer calls `cv.wait(lk)`. the producer calls `notify_one()`. **the consumer sleeps forever.** the code looks textbook. what's missing?",
  beats: [
    { t: "p", h: "a condition variable is not a flag. it has no memory: a notify with nobody waiting is lost. so the *state* must live in a variable protected by the mutex, and the waiter must re-check it. waits can also wake **spuriously** — without any notify. both problems have one fix: always wait with a predicate." },
    { t: "code", c: C`std::mutex m; std::condition_variable cv; std::queue<Job> q;

void producer(Job j) {
  { std::lock_guard lk(m); q.push(std::move(j)); }   // change state under the lock
  cv.notify_one();                                     // then notify
}
Job consumer() {
  std::unique_lock lk(m);
  cv.wait(lk, [&] { return !q.empty(); });   // == while(!pred()) cv.wait(lk);
  Job j = std::move(q.front()); q.pop();
  return j;
}` },
    {
      t: "q", q: "the producer notifies *before* the consumer reaches `cv.wait(lk)` (no predicate). result?", o: ["the wait returns immediately", "the notification is lost; consumer may wait forever", "UB", "exception"], a: 1,
      why: "condition variables don't latch. with the predicate form, the consumer checks `!q.empty()` under the lock first, sees the item, and never sleeps."
    },
    { t: "p", h: "for one-shot results, **futures** are simpler: `std::promise` / `std::packaged_task` / `std::async` produce a `std::future<T>`, and `get()` blocks until the value (or an exception!) arrives. exceptions thrown in the task are rethrown from `get()`." },
    {
      t: "q", code: C`std::async(std::launch::async, slow_task);   // 1 s
std::async(std::launch::async, slow_task);   // 1 s
// how long until we get here?`, q: "≈ how long?", o: ["~1 s (parallel)", "~2 s — they run one after another", "~0 s", "unbounded"], a: 1,
      why: "the returned std::future is a temporary destroyed at the end of each statement, and the *last* future referring to an async-launched shared state BLOCKS in its destructor until the task finishes. fire-and-forget with std::async isn't."
    },
    {
      t: "q", q: "`auto f = std::async(task);` with the default policy. guaranteed to run on another thread?", o: ["yes", "no — default is async|deferred; it may run lazily on the thread that calls get()/wait(), or never if nobody does", "only if hardware_concurrency() > 1", "it never runs concurrently"], a: 1,
      why: "deferred execution also means thread_local variables and `wait_for` timeouts behave differently (wait_for returns future_status::deferred — a timeout loop on it spins forever). pass std::launch::async when you mean it."
    },
    { t: "edge", h: "notify while holding the lock or after releasing it? both are correct with predicate waits. notifying after unlock avoids waking a thread that immediately blocks on the mutex — but if the condvar might be destroyed right after the state change (the waiter returns and frees it), notify under the lock." },
    { t: "recall", q: "why must condition-variable waits use a predicate loop?", a: "spurious wakeups can return from wait without a notify, and a notify sent before the wait is lost. checking shared state (protected by the mutex) before and after each wait handles both." },
  ],
  cards: [
    ["what is a spurious wakeup?", "a condition-variable wait returning without a notify. always wait in a predicate loop."],
    ["does a condition variable remember a notify with no waiters?", "no — it's lost. the state must live in a mutex-protected variable."],
    ["why do two discarded std::async(launch::async, …) calls run sequentially?", "the temporary future's destructor blocks until its async task completes."],
    ["default std::async launch policy?", "async | deferred — it may run lazily on get()/wait(), or never."],

lesson({
  id: "memmodel", title: "the memory model & atomics", widgetLabel: "litmus tests",
  src: ["c++ concurrency in action · ch 5", "c++ high performance · ch 10 lock-free", "effective modern c++ · item 40"],
  hook: "thread 1 writes `x = 1` then reads `y`. thread 2 writes `y = 1` then reads `x`. **both read 0.** no interleaving of four instructions produces that. your cpu does it anyway.",
  beats: [
    { t: "p", h: "compilers reorder independent instructions, and cpus have store buffers, caches and speculative loads. so 'program order' is not what other threads observe. the c++ memory model defines what *is* guaranteed via **happens-before**: if A happens-before B, B sees A's effects. you create that edge with mutexes, or with atomics using the right **memory order**." },
    { t: "w", id: "litmus" },
    { t: "ul", items: ["`memory_order_seq_cst` (default): all seq_cst ops appear in one global order consistent with program order. easiest to reason about; costs a full fence on stores on x86.", "`release` (store) / `acquire` (load): if an acquire load reads a release store, everything before the release happens-before everything after the acquire. this is the publish/subscribe pattern and it covers most needs.", "`relaxed`: atomicity only — no ordering with other variables. fine for counters/statistics, nothing else."] },
    {
      t: "q", code: C`std::atomic<int> n{0};
// 8 threads, each: for (1M) n++;`, q: "final value of n?", o: ["exactly 8,000,000", "≤ 8,000,000, varies", "UB", "8,000,000 only with seq_cst"], a: 0,
      why: "`n++` on an atomic is a single atomic read-modify-write (fetch_add). no lost updates under ANY memory order, even relaxed — ordering is about *other* variables, not this one's atomicity. (it'll be slow: every increment bounces the cache line between cores.)"
    },
    {
      t: "q", code: C`std::atomic<bool> ready{false}; int data = 0;
// T1:
data = 42; ready.store(true, std::memory_order_relaxed);
// T2:
while (!ready.load(std::memory_order_relaxed)) {}
std::cout << data;`, q: "what is this program?", o: ["prints 42 always", "prints 42 or 0", "has a data race on `data` → UB", "deadlocks"], a: 2,
      why: "relaxed creates no happens-before, so the non-atomic accesses to `data` race → UB, not merely 'might print 0'. change to store(release) / load(acquire) and it's correct and prints 42."
    },
    {
      t: "q", q: "`compare_exchange_weak` may fail even when the value equals `expected`. why does it exist?", o: ["it's deprecated", "on ll/sc architectures (arm, power) a strong CAS needs an internal retry loop; weak exposes the spurious failure so your *own* loop handles it — cheaper inside a loop", "it's faster on x86", "for relaxed ordering only"], a: 1,
      why: "use weak inside a retry loop (you loop anyway), strong when a single attempt's result matters. on x86 both compile to `lock cmpxchg`."
    },
    { t: "edge", h: "x86 is 'TSO': it only reorders a store with a *later* load (exactly the store-buffering test). so acquire/release are free on x86 and relaxed bugs hide there. arm and power reorder much more. code tested only on x86 is not tested." },
    { t: "rule", h: "use seq_cst until a profiler says otherwise; then acquire/release for publish/subscribe; relaxed only for isolated counters. if you can't draw the happens-before edges, use a mutex." },
    { t: "recall", q: "what does a release store paired with an acquire load guarantee?", a: "if the acquire load reads the value written by the release store (they synchronize-with), every write sequenced before the release in the writer happens-before every read after the acquire in the reader — the reader sees all of it." },
  ],
  cards: [
    ["what does happens-before give you?", "if A happens-before B, B observes A's effects. created by synchronization (mutex, release/acquire, seq_cst)."],
    ["release/acquire in one sentence?", "an acquire load that reads a release store makes everything before the store visible after the load."],
    ["can relaxed atomic increments lose updates?", "no — atomicity of RMW holds at every memory order. ordering is about other variables."],
    ["compare_exchange_weak vs strong?", "weak may fail spuriously (cheaper on LL/SC); use it in loops. strong only fails if values differ."],
    ["what reordering does x86 allow?", "store followed by a load to a different address (store buffering). nothing else among normal ops."],
    ["why is the store-buffering outcome (0,0) forbidden under seq_cst?", "seq_cst imposes a single total order; whichever store is first must be visible to the other thread's subsequent load."],
  ]

lesson({
  id: "lockfree", title: "lock-free & parallel algorithms", widgetLabel: "amdahl",
  src: ["c++ concurrency in action · ch 7–8, 10", "c++ high performance · ch 10–11 concurrency, parallel stl"],

  beats: [
    { t: "p", h: "the ceiling on parallel speedup is the serial fraction (amdahl). but in practice the bigger killers are hidden serialization: a shared lock, a shared atomic counter, a shared allocator, or **false sharing** — independent variables that happen to sit on the same cache line, which the coherence protocol bounces between cores as if they were one." },
    { t: "w", id: "amdahl" },
    { t: "code", c: C`struct Counters {                         // 8 threads, each bumps its own slot
  std::atomic<long> c[8];                  // ✗ all 8 share one 64-byte line → ping-pong
};
struct alignas(64) Padded { std::atomic<long> v; };
struct Counters2 { Padded c[8]; };          // ✓ one line per thread
// c++17: std::hardware_destructive_interference_size instead of 64` },
    {
      t: "q", code: C`template<class T> struct Stack {
  struct Node { T v; Node* next; };
  std::atomic<Node*> head;
  void push(T v) {
    Node* n = new Node{v, head.load()};
    while (!head.compare_exchange_weak(n->next, n)) {}
  }
};`, q: "is this push correct?", o: ["no — n->next is stale after a failure", "yes — on failure compare_exchange_weak writes the current head into n->next, so the loop retries with fresh data", "no — needs a mutex", "only with seq_cst explicitly"], a: 1,
      why: "the `expected` argument is updated on failure. that's the canonical lock-free push. the hard part is *pop*: reading head->next after another thread popped and freed head (use-after-free), and ABA. that's why concurrency in action spends chapters on hazard pointers and reference counting."
    },
    {
      t: "q", q: "the ABA problem is…", o: ["two threads both writing A", "a CAS succeeds because the value is A again — but in between it changed to B and back (e.g. a node freed and its address reused), so the assumptions behind the CAS are stale", "a deadlock between atomics", "an x86-only bug"], a: 1,
      why: "CAS compares bits, not history. fixes: tagged pointers / version counters (double-width CAS), hazard pointers, epoch-based reclamation, or never reusing memory while readers may hold it."
    },
    {
      t: "q", code: C`std::vector<int> v = /* 100M */;
std::mutex m; long sum = 0;
std::for_each(std::execution::par_unseq, v.begin(), v.end(),
  [&](int x) { std::lock_guard l(m); sum += x; });`, q: "what's wrong?", o: ["just slow", "UB: par_unseq allows interleaving iterations on one thread (vectorization), so taking a mutex can deadlock; and it serializes anyway", "nothing", "compile error"], a: 1,

    { t: "rule", h: "lock-free is not a performance feature by default — it's a progress guarantee. the fastest concurrent code shares nothing: partition the data, give each thread its own accumulator (padded), combine at the end." },
    { t: "recall", q: "what is false sharing and how do you fix it?", a: "threads writing to distinct variables on the same cache line force the line to bounce between cores' caches under coherence, serializing them. fix by padding/aligning per-thread data to the destructive interference size (64B), or by using thread-local accumulators." },
  ],
  cards: [
    ["amdahl's law?", "speedup = 1 / ((1−p) + p/n). serial fraction 1−p caps speedup at 1/(1−p)."],
    ["what is false sharing?", "independent variables on one cache line written by different cores; coherence traffic serializes them."],
    ["what is the ABA problem?", "CAS succeeds because the value returned to its old bits, though the state changed in between (e.g. freed + reused node)."],
